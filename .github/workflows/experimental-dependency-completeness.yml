name: Experimental dependency completeness audit
on:
  push:
    branches: [experiment/dependency-completeness-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Install reviewed dependencies
        run: python -m pip install -e ".[attest]"
      - name: Run adversarial audit fixtures
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_dependency_completeness_audit.py -v
      - name: Full unmodified regression suite
        env:
          PYTHONPATH: src
        run: python scripts/run_reviewed_suite.py --min-tests 150
