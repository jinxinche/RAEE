name: Experimental dependency completeness audit
on:
  push:
    branches: [experiment/dependency-completeness-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    timeout-minutes: 40
    env:
      PYTHONIOENCODING: utf-8
      TMPDIR: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
      TEMP: ${{ runner.temp }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        # Minimum supported and current stable CPython.
        python: ['3.10', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Verify requested interpreter
        shell: bash
        run: |
          python - <<'PY'
          import platform, struct, sys
          expected = tuple(int(part) for part in "${{ matrix.python }}".split("."))
          print(platform.python_version(), platform.platform(), platform.machine())
          if sys.version_info[:2] != expected or struct.calcsize("P") * 8 != 64:
              raise SystemExit("Interpreter version or architecture mismatch")
          PY
      - name: Install reviewed dependencies
        run: python -m pip install -e ".[attest]"
      - name: Run adversarial audit fixtures
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_dependency_completeness_audit.py -v
      - name: Full unmodified regression suite
        env:
          PYTHONPATH: src
        run: python scripts/run_reviewed_suite.py --min-tests 240 --require-critical-modules
