name: Experimental dependency completeness audit
on:
  push:
    branches: [experiment/dependency-completeness-audit]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        # Minimum supported and current stable CPython.
        python: ['3.10', '3.15']
        architecture: [x64]
        include:
          - {os: ubuntu-latest, python: '3.11', architecture: x64}
          - {os: ubuntu-latest, python: '3.12', architecture: x64}
          - {os: ubuntu-latest, python: '3.13', architecture: x64}
          - {os: ubuntu-latest, python: '3.14', architecture: x64}
          - {os: macos-15, python: '3.10', architecture: arm64}
          - {os: macos-15, python: '3.15', architecture: arm64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - name: Verify requested interpreter
        shell: bash
        run: |
          python - <<'PY'
          import platform, struct, sys
          expected = tuple(int(part) for part in "${{ matrix.python }}".split("."))
          print(platform.python_version(), platform.platform(), platform.machine())
          machines = {"x64": {"x86_64", "amd64"}, "arm64": {"arm64", "aarch64"}}
          if (sys.version_info[:2] != expected or struct.calcsize("P") * 8 != 64
              or platform.machine().lower() not in machines["${{ matrix.architecture }}"]):
              raise SystemExit("Interpreter version or architecture mismatch")
          PY
      - name: Install reviewed dependencies
        run: |
          python -m pip install -e ".[attest]"
          python -m pip check
      - name: Build and test standalone core wheel
        run: |
          python -m pip wheel --no-deps . --wheel-dir wheelhouse
          python scripts/smoke_installed_package.py --wheel-dir wheelhouse
      - name: Run adversarial audit fixtures
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_dependency_completeness_audit.py -v
      - name: Verify minimum build backend
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.10'
        run: |
          python -m pip install setuptools==77.0.3
          python -m pip wheel --no-build-isolation --no-deps . --wheel-dir wheelhouse/minimum
          python scripts/smoke_installed_package.py --wheel-dir wheelhouse/minimum
      - name: Full unmodified regression suite
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: python scripts/run_reviewed_suite.py --min-tests 268 --require-critical-modules --summary test-results/summary.json
      - name: Preserve test outcome counts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reviewed-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.architecture }}
          path: test-results/summary.json
          if-no-files-found: warn
          retention-days: 14
  audit-gate:
    name: Dependency audit gate
    needs: audit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every matrix job to succeed
        env:
          MATRIX_RESULT: ${{ needs.audit.result }}
        run: test "$MATRIX_RESULT" = success
