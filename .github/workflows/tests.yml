# TESTS ONLY ON TRUSTED MAIN, NEVER ON FORK PULL REQUESTS.
name: Trusted cross-platform tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: trusted-${{ matrix.os }}-py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install on trusted branch only
        run: python -m pip install -e ".[attest]"
      - name: Run regression suite
        run: python scripts/run_reviewed_suite.py --min-tests 150
      - name: Exercise untrusted-PR risk cases (Ubuntu, offline)
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/local_pr_attack_smoke.py
      - name: Validate synthetic fixtures
        run: raee-lite validate-corpus --index validation_corpus/index.json --out validation_corpus/summary.json
      - name: Nonexecuting inventory
        run: raee-lite check
