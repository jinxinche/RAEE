# Reviewed main and maintainer branch pushes; never execute untrusted fork PRs.
name: Trusted cross-platform tests
on:
  push:
    branches: [main, 'maintenance/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reviewed-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: trusted-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        # Minimum supported and current stable CPython.
        python-version: ['3.10', '3.15']
        architecture: [x64]
        include:
          - {os: ubuntu-latest, python-version: '3.11', architecture: x64}
          - {os: ubuntu-latest, python-version: '3.12', architecture: x64}
          - {os: ubuntu-latest, python-version: '3.13', architecture: x64}
          - {os: ubuntu-latest, python-version: '3.14', architecture: x64}
          - {os: macos-15, python-version: '3.10', architecture: arm64}
          - {os: macos-15, python-version: '3.15', architecture: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
      - name: Verify requested interpreter
        shell: bash
        run: |
          python - <<'PY'
          import platform, struct, sys
          expected = tuple(int(part) for part in "${{ matrix.python-version }}".split("."))
          machines = {"x64": {"x86_64", "amd64"}, "arm64": {"arm64", "aarch64"}}
          print(platform.python_version(), platform.platform(), platform.machine())
          if (sys.version_info[:2] != expected or struct.calcsize("P") * 8 != 64
              or platform.machine().lower() not in machines["${{ matrix.architecture }}"]):
              raise SystemExit("Interpreter version or architecture mismatch")
          PY
      - name: Install on trusted branch only
        run: |
          python -m pip install -e ".[attest]"
          python -m pip check
      - name: Build and test standalone core wheel
        run: |
          python -m pip wheel --no-deps . --wheel-dir wheelhouse
          python scripts/smoke_installed_package.py --wheel-dir wheelhouse
      - name: Verify minimum build backend and signing dependency
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        run: |
          python -m pip install setuptools==77.0.3 cryptography==42.0.0
          python -m pip check
          python -m pip wheel --no-build-isolation --no-deps . --wheel-dir wheelhouse/minimum
          python scripts/smoke_installed_package.py --wheel-dir wheelhouse/minimum
      - name: Run regression suite
        env:
          PYTHONIOENCODING: utf-8
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: python scripts/run_reviewed_suite.py --require-critical-modules --summary test-results/summary.json
      - name: Exercise untrusted-PR risk cases (Ubuntu, offline)
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/local_pr_attack_smoke.py
      - name: Validate synthetic fixtures
        run: raee-lite validate-corpus --index validation_corpus/index.json --out validation_corpus/summary.json --require-exact
      - name: Nonexecuting inventory
        run: raee-lite check
      - name: Preserve regression outcome counts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trusted-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.architecture }}
          path: test-results/summary.json
          if-no-files-found: warn
          retention-days: 14
  test-gate:
    name: Trusted regression gate
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every matrix job to succeed
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: test "$MATRIX_RESULT" = success
