# TESTS ONLY ON TRUSTED MAIN, NEVER ON FORK PULL REQUESTS.
name: Trusted cross-platform tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: trusted-${{ matrix.os }}-py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Minimum supported and current stable CPython.
        python-version: ['3.10', '3.15']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install on trusted branch only
        run: |
          python -m pip install -e ".[attest]"
          python -m pip check
      - name: Build and test standalone core wheel
        run: |
          python -m pip wheel --no-deps . --wheel-dir wheelhouse
          python scripts/smoke_installed_package.py --wheel-dir wheelhouse
      - name: Run regression suite
        env:
          PYTHONIOENCODING: utf-8
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: python scripts/run_reviewed_suite.py --min-tests 268 --require-critical-modules
      - name: Exercise untrusted-PR risk cases (Ubuntu, offline)
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/local_pr_attack_smoke.py
      - name: Validate synthetic fixtures
        run: raee-lite validate-corpus --index validation_corpus/index.json --out validation_corpus/summary.json
      - name: Nonexecuting inventory
        run: raee-lite check
  test-gate:
    name: Trusted regression gate
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every matrix job to succeed
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: test "$MATRIX_RESULT" = success
