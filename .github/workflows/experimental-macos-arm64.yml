# Supplemental experiment: reproduce original macos-latest ARM64 failure
# after canonicalizing only an owned temporary fixture root.
name: Experimental macOS 26 ARM64 receipt verification
on:
  push:
    branches: [experiment/real-cross-os-matrix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm64-receipt:
    name: macos26-arm64-py${{ matrix.python }}
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          architecture: arm64
      - name: Verify ARM64 interpreter identity
        shell: bash
        run: |
          python - <<'PY'
          import json, platform, sys, struct
          actual = sys.version_info[:2]
          expected = tuple(int(x) for x in "${{ matrix.python }}".split("."))
          identity = {"os": platform.platform(), "machine": platform.machine(),
                      "python": platform.python_version(), "pointer_bits": struct.calcsize("P") * 8}
          print(json.dumps(identity, indent=2))
          if actual != expected or platform.machine().lower() not in ("arm64", "aarch64") or identity["pointer_bits"] != 64:
              raise SystemExit("ARM64/Python identity mismatch; do not publish a receipt")
          PY
      - name: Reproduce original failing receipt generation after fix
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          python benchmarks/real_runner_receipt.py --out receipt-arm64.json
      - name: Upload actual ARM64 receipt (no fabricated fallback)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos26-arm64-py${{ matrix.python }}
          path: receipt-arm64.json
          if-no-files-found: error
          retention-days: 14
