# Enable and manually dispatch only AFTER main branch protection is active.
# A signed claim is NOT a guarantee of code correctness.
name: Trusted Evidence Attestation
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: raee-provenance-main
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main' && github.repository == 'jinxinche/RAEE'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install from the protected main branch only
        run: |
          python -m pip install ".[attest]"
          python -m pip check
      - name: Execute reviewed acceptance tests on trusted main
        env:
          CI: 'true'
        run: |
          raee-lite init
          raee-lite add "Trusted regression suite executes successfully"
          raee-lite expect --for R1 --kind unit
          raee-lite run --for R1 --kind unit --allow-ci-execution -- python scripts/run_reviewed_suite.py --require-critical-modules
          raee-lite report
      - name: Export bounded claim (not yet authenticated)
        env:
          CI: 'true'
        run: |
          raee-lite ci-export \
            --expected-repo 'jinxinche/RAEE' \
            --trusted-ref refs/heads/main \
            --workflow .github/workflows/trusted-evidence.yml
      - name: Prepare strictly allowlisted handoff (no hidden directory upload)
        run: |
          mkdir -p handoff
          cp .raee/ci-evidence.json handoff/ci-evidence.json
          cp .raee/report.json handoff/report.json
      - name: Transfer ONLY the generated claim and report to the signing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence-claim
          path: |
            handoff/ci-evidence.json
            handoff/report.json
          if-no-files-found: error
          retention-days: 30
  sign:
    needs: collect
    if: github.ref == 'refs/heads/main' && github.repository == 'jinxinche/RAEE'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      # DO NOT CHECK OUT REPOSITORY CODE OR RUN BUILD SCRIPTS IN THIS JOB.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-evidence-claim
          path: signed
      - name: GitHub-backed Sigstore attestation for the exact bytes
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: signed/ci-evidence.json
      - name: Make exact subject and bundle downloadable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: independently-verifiable-evidence
          path: |
            signed/ci-evidence.json
            signed/report.json
            ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30
