# Threat model: external fork content is DATA, never an executable or workflow script.
name: PR Boundary (read-only)
on:
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  contents: read
jobs:
  static-safety:
    name: pr-boundary-inspection
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Fetch the current trusted main; an old PR event may carry a stale base.sha.
          ref: refs/heads/main
          path: base
          persist-credentials: false
      - name: Checkout PR head as untrusted data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - name: Use trusted Python interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Inventory PR security-sensitive changes (inspection, not approval)
        shell: bash
        run: |
          # This script comes from the trusted main checkout. PR head is passive data.
          # Exit 0 = no sensitive paths found.
          # Exit 1 = sensitive paths found, manual review needed; scan completed.
          # Exit 2+ = scanner/integrity error, fail this required inspection gate.
          set +e
          python base/scripts/pr_boundary.py --base base --head head
          scan_status=$?
          set -e
          case "$scan_status" in
            0)
              echo "Read-only risk inventory completed: no protected paths detected."
              echo "### PR risk inventory: no protected paths detected" >> "$GITHUB_STEP_SUMMARY"
              ;;
            1)
              echo "::warning title=Sensitive changes — maintainer review required::Static scan completed and found trust-boundary file changes. The green inspection status is NOT a security approval. Review the paths in this job log."
              echo "### PR risk inventory: REVIEW REQUIRED" >> "$GITHUB_STEP_SUMMARY"
              echo "Protected files changed. **This step reports a completed inventory, not a security approval.** The solo maintainer must review and acknowledge the affected files in the PR discussion before a merge decision. There is no independent security audit." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error title=PR risk inventory failed::Trusted inspector did not complete successfully (exit $scan_status)."
              exit "$scan_status"
              ;;
          esac
      # No PR-provided code is executed.
