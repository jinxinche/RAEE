# Experiment-only: executes explicitly reviewed fixtures from this named branch.
# NO production secrets, OIDC, write token, caches or privileged pull_request_target.
name: Experimental real OS Python evidence matrix
on:
  push:
    branches: [experiment/real-cross-os-matrix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipt:
    name: receipt-${{ matrix.os }}-py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record runner image and CPU architecture (diagnostic only)
        shell: bash
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Runner architecture: $RUNNER_ARCH"
          echo "Image OS: ${ImageOS:-unknown}"
          echo "Image version: ${ImageVersion:-unknown}"
          echo "Requested Python: ${{ matrix.python }}"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Verify actual interpreter and architecture before collecting evidence
        shell: bash
        run: |
          python - <<'PY'
          import json, platform, struct, sys
          expected = tuple(int(x) for x in "${{ matrix.python }}".split("."))
          actual = sys.version_info[:2]
          print(json.dumps({
              "requested_python": ".".join(map(str, expected)),
              "actual_python": platform.python_version(),
              "platform": platform.platform(),
              "machine": platform.machine(),
              "pointer_bits": struct.calcsize("P") * 8,
          }, indent=2))
          if actual != expected or struct.calcsize("P") * 8 != 64:
              raise SystemExit("Interpreter version or architecture mismatch")
          PY
      - name: Generate actual runner-local proof-obligation receipt
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          python benchmarks/real_runner_receipt.py --out receipt.json
      - name: Mark failed runner setup or receipt generation
        if: failure()
        shell: bash
        run: |
          echo "::error title=Real OS/Python receipt unavailable::No valid evidence receipt from this matrix job. Inspect the setup-python and receipt-generation steps; aggregate remains blocked."
      - name: Upload ONLY bounded generated JSON receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: receipt-${{ matrix.os }}-py${{ matrix.python }}
          path: receipt.json
          if-no-files-found: error
          retention-days: 14
  aggregate:
    needs: receipt
    if: ${{ always() && needs.receipt.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: receipt-*
          path: runner-receipts
          merge-multiple: false
      - name: Test matrix fail-closed invariants and macOS temporary path safety
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_real_cross_os_protocol.py' -v
      - name: Aggregate actual six-runner evidence, fail if missing
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          python benchmarks/aggregate_real_matrix.py --input runner-receipts --output real-cross-os-metrics.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-cross-os-metrics
          path: real-cross-os-metrics.json
          if-no-files-found: error
          retention-days: 30
